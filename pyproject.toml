[project]
name = "wzry-ams-exchange"
version = "2.0.0"
description = "王者荣耀体验服 AMS 兑换工具 — 逆向接口分析 + CLI + Web 应用"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "wzry-ams-exchange"}
]
keywords = ["wzry", "ams", "reverse-engineering", "honor-of-kings"]

dependencies = [
    "requests>=2.28",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "websocket-client>=1.6",
]

[project.scripts]
wzry-exchange = "wzry_ams.cli_exchange:main"
wzry-login = "wzry_ams.cli_login:main"
wzry-web = "wzry_ams.web:main"
wzry-watchdog = "wzry_ams.watchdog:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv]
required-version = "==0.9.28"

[tool.hatch.build.targets.wheel]
packages = ["src/wzry_ams"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pyright>=1.1",
    "pytest>=8",
    "pytest-cov>=5",
    "httpx2>=2.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["wzry_ams"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src"]
reportMissingImports = true
reportMissingTypeStubs = false
