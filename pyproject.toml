[project]
name = "wzry-ams-exchange"
version = "1.0.0"
description = "王者荣耀体验服 AMS 兑换工具 — 逆向接口分析 + CLI + Web 应用"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "wzry-ams-exchange"}
]
keywords = ["wzry", "ams", "reverse-engineering", "honor-of-kings"]

dependencies = [
    "requests>=2.28",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "websocket-client>=1.6",
]

[project.optional-dependencies]
dev = []

[project.scripts]
wzry-exchange = "wzry_ams.cli_exchange:main"
wzry-login = "wzry_ams.cli_login:main"
wzry-web = "wzry_ams.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wzry_ams"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pyright>=1.1",
    "pytest>=8",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["wzry_ams"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src"]
reportMissingImports = true
reportMissingTypeStubs = false
