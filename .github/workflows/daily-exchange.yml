name: daily-exchange

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-exchange
  cancel-in-progress: false

jobs:
  exchange:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.9.28'
          python-version: '3.12.11'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked runtime dependencies
        run: uv sync --locked --no-dev

      - name: Write Credential Bundle
        env:
          CREDENTIAL_BUNDLE: ${{ secrets.COOKIES_FILE }}
        run: |
          if [ -z "$CREDENTIAL_BUNDLE" ]; then
            echo "COOKIES_FILE secret is empty" >&2
            exit 2
          fi
          umask 077
          printf '%s' "$CREDENTIAL_BUNDLE" > cookies.txt

      - name: Redeem Daily Run
        run: uv run --no-sync wzry-exchange -c cookies.txt -r 3 -r 4

      - name: Remove Credential Bundle
        if: always()
        run: rm -f cookies.txt
